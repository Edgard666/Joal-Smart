# Construit, teste et publie l'image sur ghcr.io. Unraid voit alors « update ready ».
#  - à chaque push sur main (nouvelle version du code) ;
#  - chaque lundi : nouvelle version de JOAL, mise à jour de Java ou nouveaux profils .client ;
#  - à la demande (onglet Actions > Image Docker > Run workflow).
# Rien n'est publié si un test échoue (GitHub envoie alors un e-mail), ni si l'image
# publiée a déjà exactement les mêmes entrées (pas de fausse mise à jour dans Unraid).
name: Image Docker

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Publier même si rien n'a changé
        type: boolean
        default: false

# contents: write pour créer la Release GitHub, packages: write pour publier l'image.
permissions:
  contents: write
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/joal-smart-controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (Node 24)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0 (Node 24)
        with:
          python-version: '3.12'

      - name: Connexion à ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0 (Node 24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dernières versions (JOAL, Java, profils .client)
        id: inputs
        run: python3 ci/resolve_inputs.py >> "$GITHUB_OUTPUT"

      - name: Image déjà publiée avec les mêmes entrées ?
        id: published
        run: |
          IMAGE="${IMAGE,,}"
          current=""
          if docker pull --quiet "$IMAGE:latest" >/dev/null 2>&1; then
            current=$(docker inspect --format '{{ index .Config.Labels "app.joal-smart-controller.inputs" }}' "$IMAGE:latest")
          fi
          echo "Publiée : ${current:-aucune} · nouvelle : ${{ steps.inputs.outputs.inputs }}"
          if [ "$current" = "${{ steps.inputs.outputs.inputs }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Rien à publier : l'image en ligne a déjà JOAL ${{ steps.inputs.outputs.joal_version }} et les mêmes entrées." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests unitaires
        if: steps.published.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Contrôle du JavaScript de l'interface
        if: steps.published.outputs.changed == 'true'
        run: |
          for file in app/static/*.js; do node --check "$file"; done
          node tests/test_table_sort.cjs

      - name: Tests navigateur (Chromium)
        if: steps.published.outputs.changed == 'true'
        run: |
          # Le Chromium exact de cette version de Playwright (le Chrome du serveur GitHub n'est
          # pas forcément compatible), comme pour les tests lancés en développement.
          python3 -m pip install --quiet playwright==1.63.0
          python3 -m playwright install --with-deps chromium
          export CHROMIUM="$(python3 -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')"
          "$CHROMIUM" --version
          failed=""
          for test in tests/browser_*.py; do
            echo "::group::$test"
            if ! timeout 300 python3 "$test" > test.log 2>&1; then
              failed="$failed $test"
              echo "::endgroup::"
              echo "::error title=Test navigateur en échec::$test"
              grep -v '^127.0.0.1' test.log | tail -n 40
            else
              tail -n 1 test.log
              echo "::endgroup::"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Tests navigateur en échec :$failed"
            exit 1
          fi

      - name: Construction
        if: steps.published.outputs.changed == 'true'
        run: |
          docker build \
            --build-arg JOAL_IMAGE="${{ steps.inputs.outputs.joal_image }}" \
            --build-arg JDK_IMAGE="${{ steps.inputs.outputs.jdk_image }}" \
            --build-arg BASE_IMAGE="${{ steps.inputs.outputs.base_image }}" \
            --build-arg JOAL_VERSION="${{ steps.inputs.outputs.joal_version }}" \
            --build-arg BUILD_INPUTS="${{ steps.inputs.outputs.inputs }}" \
            -t joal-smart-controller:candidate .

      - name: Tests dans l’image
        if: steps.published.outputs.changed == 'true'
        # v1.34: the unit tests also run with the image's Python and Java, as user 99:100;
        # JOAL_JAR enables the tests that drive the real patched JOAL (hot add/remove, port).
        run: |
          docker run --rm --user 99:100 -e HOME=/tmp -e JOAL_JAR=/opt/joal/joal.jar \
            -v "$PWD:/src:ro" -w /src/tests --entrypoint python3 joal-smart-controller:candidate \
            -B -m unittest discover -s . -p "test_*.py"

      - name: Essai de bout en bout (JOAL + télémétrie + contrôleur)
        if: steps.published.outputs.changed == 'true'
        run: python3 ci/smoke_image.py --image joal-smart-controller:candidate

      - name: Publication
        if: steps.published.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${IMAGE,,}"
          version="${{ steps.inputs.outputs.app_version }}-joal${{ steps.inputs.outputs.joal_version }}"
          for tag in latest "$version"; do
            docker tag joal-smart-controller:candidate "$IMAGE:$tag"
            docker push --quiet "$IMAGE:$tag"
          done
          {
            echo "### Publiée : \`$IMAGE:latest\` ($version)"
            echo "- JOAL ${{ steps.inputs.outputs.joal_version }}, ${{ steps.inputs.outputs.profiles }} profils .client"
            echo "- Java : \`${{ steps.inputs.outputs.jdk_image }}\` (jlink), base \`${{ steps.inputs.outputs.base_image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release GitHub
        if: steps.published.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.inputs.outputs.app_version }}-joal${{ steps.inputs.outputs.joal_version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag déjà présente"
            exit 0
          fi
          python3 ci/release_notes.py "${{ steps.inputs.outputs.app_version }}" "${{ steps.inputs.outputs.joal_version }}" \
            "${{ steps.inputs.outputs.jdk_image }}" "${{ steps.inputs.outputs.profiles }}" > release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --notes-file release-notes.md \
            --title "JOAL Smart Controller ${{ steps.inputs.outputs.app_version }} · JOAL ${{ steps.inputs.outputs.joal_version }}"
